name: Terraform CI/CD

on:
  push:
    branches:
      - feature/**  # 👈 Agar aap kisi aur branch par kaam kar rahe hain, toh yahan naam badal dein

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      # 🚀 Apply Step: Yeh plan ke baad resources ko deploy kar dega
      - name: Terraform Apply
        run: terraform apply -auto-approve
